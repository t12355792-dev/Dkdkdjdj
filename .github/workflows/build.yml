name: Build Galactic Axe Mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.10.3'

      - name: Распаковать исходники
        run: unzip -o galacticaxe-mod-src.zip -x ".github/*"

      - name: Build jar
        run: gradle build --no-daemon
        env:
          GRADLE_OPTS: -Dhttps.protocols=TLSv1.2 -Dfile.encoding=UTF-8

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: galacticaxe-jar
          path: build/libs/*.jar
